<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Jump</title>
  <meta name="description" content="A daily one-screen precision platformer: three new rooms every day, the same for everyone. Wall-jump, dodge, race the ghosts.">
  <meta name="theme-color" content="#0f0f1e">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daily Jump">
  <!-- link previews (WhatsApp, iMessage, Discord…); the server fills in its own address -->
  <meta property="og:type" content="website">
  <meta name="share-url" content="https://skovacic3.github.io/daily-jump-play/">
  <meta property="og:title" content="Daily Jump">
  <meta property="og:description" content="Three new rooms every day, the same for everyone. Wall-jump, dodge spikes and saws, race other players' ghosts.">
  <meta property="og:image" content="https://skovacic3.github.io/daily-jump-play/game/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #0f0f1e;
      --panel: rgba(15, 15, 30, 0.88);
      --text: #f1faee;
      --muted: #a8a8c0;
      --accent: #ffd166;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    /* The room plus a strip under it for the ghost button: nothing UI ever sits on
       the playfield, where it could hide a spike. */
    .game {
      position: relative;
      /* fit inside the window both ways, keeping 16:9 (and the strip below) */
      width: min(960px, 100%, calc((100dvh - 32px - 44px) * 16 / 9));
      margin-bottom: 44px;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      justify-content: safe center; /* taller than the stage: scroll from the top, don't clip it */
      gap: 6px;
      padding: 16px;
      text-align: center;
      background: var(--panel);
      overflow-y: auto;
    }
    #overlay[hidden] { display: none; }
    /* Short screens (phones held sideways): tighter menus so Start and Past levels fit */
    @media (max-height: 460px) {
      #overlay h1 { font-size: 30px; }
      #overlay { gap: 2px; padding: 8px 12px; }
      #overlay p { margin: 2px 0; line-height: 1.3; font-size: 13px; }
      #overlay .hint { display: none; }
      #overlay button { margin-top: 4px; padding: 7px 22px; font-size: 15px; }
      #overlay button.secondary { padding: 5px 16px; font-size: 13px; }
    }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 52px); letter-spacing: -0.02em; color: var(--accent); }
    p { margin: 4px 0; line-height: 1.5; }
    .sub { color: var(--muted); font-weight: 600; }
    /* the title's secondary actions: rows, not a tall stack */
    .menu-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .menu-row button { margin-top: 6px; }
    .menu-row.chips button.chip { padding: 4px 12px; font-size: 13px; border-color: #33334d; color: var(--muted); }
    .menu-row.chips button.chip:hover { color: var(--text); }
    .twist { margin: 2px 0; padding: 3px 12px; border-radius: 999px; background: rgba(154, 209, 255, 0.12); border: 1px solid rgba(154, 209, 255, 0.35); color: #d6ecff; font-size: 14px; }
    .twist b { color: #fff; }
    .challenge { margin: 2px 0; padding: 3px 12px; border-radius: 999px; background: rgba(199, 125, 255, 0.14); border: 1px solid rgba(199, 125, 255, 0.45); color: #ead6ff; font-size: 14px; }
    .challenge[hidden] { display: none; }
    .challenge b { color: #fff; }
    .streak { margin: 2px 0; color: #ffb36b; font-weight: 700; font-size: 15px; }
    .hint { color: var(--muted); font-size: 14px; }
    .keys, .touch-keys { font-size: 14px; }
    .touch-keys, .pad-keys { display: none; }
    body.pad .pad-keys { display: block; font-size: 14px; }
    body.pad .keys { display: none; }
    body.touch .touch-keys { display: block; }
    kbd {
      display: inline-block;
      min-width: 24px;
      padding: 2px 6px;
      margin: 0 2px;
      border: 1px solid #44445e;
      border-bottom-width: 3px;
      border-radius: 6px;
      background: #22223a;
      font: inherit;
    }
    button {
      margin-top: 10px;
      padding: 12px 32px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #1b1b2f;
      font: 700 18px system-ui, -apple-system, sans-serif;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid #44445e;
      font-size: 15px;
      padding: 8px 22px;
    }
    .big { font-size: clamp(36px, 8vw, 64px); font-weight: 800; font-variant-numeric: tabular-nums; }
    .rows { width: min(320px, 100%); }
    .rows div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #2c2c44; }
    .rows span:last-child { color: var(--muted); }
    .share {
      margin: 8px 0 0;
      padding: 10px 14px;
      border-radius: 8px;
      background: #1b1b30;
      font-size: 15px;
      user-select: all;
      white-space: pre;
    }
    .ghost-btn {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      margin: 0;
      padding: 6px 12px;
      border: 1px solid rgba(154, 209, 255, 0.5);
      background: rgba(15, 15, 30, 0.6);
      color: #d6ecff;
      font: 600 14px system-ui, -apple-system, sans-serif;
    }
    .ghost-btn[hidden] { display: none; }
    .tip {
      position: absolute;
      left: 0;
      width: fit-content;
      max-width: calc(100% - 170px); /* the ghost button's side of the strip */
      top: calc(100% + 8px);
      padding: 6px 12px;
      border: 1px solid #ffd166;
      border-radius: 14px;
      background: rgba(16, 16, 34, 0.9);
      color: #ffe9b0;
      font: 700 13px system-ui, -apple-system, sans-serif;
      text-align: left;
      white-space: nowrap; /* one line: the strip under the room is one line tall */
      overflow: hidden;
      text-overflow: ellipsis;
      animation: tip-in 0.25s ease-out;
    }
    .tip[hidden] { display: none; }
    /* badge toast: above the room, never on the playfield */
    .toast {
      position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 10px;
      border-radius: 14px; border: 1px solid #ffd166; background: rgba(16, 16, 34, 0.95);
      color: #fff; font: 13px system-ui, -apple-system, sans-serif; white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); animation: toast-in 0.35s cubic-bezier(.2,1.4,.4,1);
      z-index: 6;
    }
    .toast[hidden] { display: none; }
    .toast-icon { font-size: 24px; }
    .toast b { display: block; color: #ffd166; }
    .toast small { color: var(--muted); }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px) scale(0.9); } }
    .badges { width: min(520px, 100%); margin: 6px 0; text-align: left; }
    .badges summary { cursor: pointer; text-align: center; color: var(--accent); font-weight: 700; font-size: 14px; }
    .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
    .badge { display: grid; grid-template-columns: 28px 1fr; column-gap: 6px; align-items: center; padding: 5px 8px; border-radius: 10px; background: #1b1b30; opacity: 0.45; font-size: 12px; }
    .badge.got { opacity: 1; border: 1px solid rgba(255, 209, 102, 0.4); }
    .badge-icon { grid-row: span 2; font-size: 20px; text-align: center; }
    .badge small { color: var(--muted); font-size: 11px; }
    .stats { width: min(420px, 100%); margin: 6px 0; }
    .stats summary { cursor: pointer; text-align: center; color: var(--accent); font-weight: 700; font-size: 14px; }
    .stat-boxes { display: flex; justify-content: center; gap: 14px; margin-top: 8px; }
    .stat-box { display: flex; flex-direction: column; align-items: center; min-width: 54px; }
    .stat-box b { font-size: 22px; font-variant-numeric: tabular-nums; }
    .stat-box small { color: var(--muted); font-size: 11px; }
    .stat-dist { margin-top: 8px; text-align: left; }
    .stat-dist > small { color: var(--muted); font-size: 11px; }
    .stat-bar { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 6px; margin: 2px 0; font-size: 12px; }
    .stat-bar span { color: var(--muted); text-align: right; }
    .stat-bar i { display: block; padding: 1px 6px; border-radius: 3px; background: #33334d; font-style: normal; font-weight: 700; text-align: right; }
    .stat-bar i.today { background: #7bc950; color: #10223a; }
    .skins { margin-top: 10px; font-size: 12px; color: var(--muted); text-align: center; }
    .skins > div { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 6px; }
    .skin-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: #1b1b30; opacity: 0.5; }
    .skin-chip.got { opacity: 1; border: 1px solid rgba(255, 209, 102, 0.4); color: var(--text); }
    .skin-chip i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid; }
    @keyframes tip-in { from { opacity: 0; transform: translateY(-4px); } }
    .ghost-btn.on { background: rgba(154, 209, 255, 0.85); color: #10223a; }
    .ghost-btn kbd, .dev kbd { font-size: 11px; min-width: 0; padding: 0 4px; border-bottom-width: 2px; }

    .room-rows { width: min(460px, 100%); margin: 6px 0 2px; }
    .room-head, .room-row {
      display: grid;
      grid-template-columns: 1fr 96px 92px auto;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      text-align: left;
    }
    .bonus-row { border-top: 1px dashed #5e2c3a; background: rgba(255, 70, 90, 0.07); }
    .bonus-row .room-name { color: #ff8fa3; }
    .lb-bonus { margin-top: 6px; }
    .lb-streak { color: #ffb36b; font-weight: 700; font-size: 0.9em; }
    .board .lb-week li { grid-template-columns: 22px 1fr auto 70px; }
    .lb-days { color: #ffd166; letter-spacing: 1px; font-size: 11px; }
    .lb-typical { display: block; font-weight: 500; opacity: 0.8; margin-top: 1px; }
    .room-head { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .room-row { border-top: 1px solid #2c2c44; border-radius: 6px; }
    .room-row.hl { background: rgba(255, 209, 102, 0.1); }
    .room-name { font-weight: 700; }
    .room-name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
    .room-best { font-variant-numeric: tabular-nums; }
    .room-now { font-size: 12px; color: var(--accent); }
    .rank { font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
    button.retry { margin: 0; padding: 5px 12px; font-size: 13px; }
    /* narrow phones: the room name keeps its width, the rank and best shrink */
    @media (max-width: 480px) {
      .room-head, .room-row { grid-template-columns: 1fr 58px 78px auto; gap: 6px; }
      .rank { font-size: 12px; letter-spacing: 0; }
      .room-best { font-size: 14px; }
    }

    /* ---------- rank card ---------- */
    #overlay.card {
      justify-content: center;
      gap: 4px;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 3px),
        radial-gradient(ellipse at 50% 35%, rgba(40, 40, 80, 0.6), rgba(6, 6, 14, 0.96) 70%);
      backdrop-filter: blur(2px);
      animation: card-in 0.18s ease-out;
    }
    @keyframes card-in { from { opacity: 0; transform: scale(1.03); } }
    .card-top { font: 700 12px ui-monospace, Menlo, monospace; letter-spacing: 0.18em; color: var(--muted); }
    .rank-art {
      margin: 4px 0 2px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      line-height: 1.05;
      color: var(--rc);
      text-shadow: 0 0 6px var(--rc), 0 0 22px color-mix(in srgb, var(--rc) 45%, transparent);
      white-space: pre;
    }
    .rank-art.glitch { animation: glitch 1.6s steps(1) infinite; }
    @keyframes glitch {
      0%, 100% { text-shadow: -2px 0 #ff3864, 2px 0 #2de2e6, 0 0 22px var(--rc); transform: none; }
      8% { text-shadow: 3px 0 #ff3864, -3px 0 #2de2e6, 0 0 22px var(--rc); transform: translate(2px, -1px) skewX(-4deg); }
      9% { transform: translate(-3px, 1px); }
      10% { transform: none; }
      55% { text-shadow: -4px 1px #ff3864, 4px -1px #2de2e6, 0 0 26px var(--rc); transform: translate(-1px, 0) skewX(3deg); }
      56% { transform: none; }
    }
    .card-time { display: flex; align-items: baseline; gap: 12px; }
    .card-time .big { font-size: clamp(28px, 5vw, 44px); }
    .card-sub { color: var(--muted); font: 13px ui-monospace, Menlo, monospace; }
    .card-shard { margin-left: 10px; color: #ffb547; text-shadow: 0 0 8px rgba(255, 181, 71, 0.6); }
    .card-shard.missed { color: var(--muted); text-shadow: none; font-weight: 500; }
    .shard-mark { color: #ffb547; text-shadow: 0 0 6px rgba(255, 181, 71, 0.6); }
    .shard-mark.missed { color: var(--muted); text-shadow: none; opacity: 0.7; }
    .card-best { min-height: 1.3em; color: var(--accent); font-weight: 700; font-size: 14px; }
    .card-best .split { margin-left: 6px; font-variant-numeric: tabular-nums; }
    .map-preview { display: block; width: 100%; max-width: 640px; margin: 10px auto 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); }
    .card-best .split.ahead { color: #7dffa1; }
    .card-best .split.behind { color: #ff7a7a; }
    .card-best .split.even { color: #ddd; }
    .ladder { width: min(420px, 100%); font: 13px ui-monospace, Menlo, monospace; margin: 2px 0; }
    .lad {
      display: grid;
      grid-template-columns: 16px 104px 76px 1fr;
      align-items: center;
      padding: 2px 6px;
      text-align: left;
      color: color-mix(in srgb, var(--rc) 55%, #55556e);
      opacity: 0.75;
    }
    .lad.above { opacity: 0.95; }
    .lad.you {
      opacity: 1;
      color: var(--rc);
      background: color-mix(in srgb, var(--rc) 14%, transparent);
      border-left: 2px solid var(--rc);
      border-radius: 4px;
      font-weight: 700;
    }
    .lad-mark { color: var(--rc); }
    .lad-note { color: var(--muted); font-size: 11px; }
    .lad.you .lad-note { color: var(--text); }
    .card-chase { color: var(--muted); font-size: 13px; min-height: 1.3em; }
    .card-chase b { color: var(--text); }
    .card-btns { display: flex; gap: 10px; align-items: center; }
    .card-btns kbd { font-size: 11px; min-width: 0; padding: 0 4px; border-bottom-width: 2px; background: rgba(0,0,0,0.15); border-color: rgba(0,0,0,0.25); }
    @media (max-height: 420px) { .ladder { display: none; } }

    /* ---------- online ---------- */
    .card-net { min-height: 1.2em; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
    .card-net.ok { color: #7bc950; }
    .card-crowd { min-height: 1.1em; font-size: 13px; color: #ffd166; }
    .card-net.bad { color: #ff8fa3; }
    .board { width: min(560px, 100%); margin-top: 10px; text-align: left; font-size: 13px; }
    .board h3 { margin: 10px 0 4px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
    .board h3 small { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 4px; }
    .board ol { list-style: none; margin: 0; padding: 0; }
    .board li { display: grid; grid-template-columns: 22px 1fr auto 22px; gap: 6px; padding: 2px 4px; border-radius: 4px; font-variant-numeric: tabular-nums; }
    .board li.me { background: rgba(255, 209, 102, 0.14); color: var(--accent); }
    .board .lb-place { color: var(--muted); text-align: right; }
    .board .lb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board .lb-rank { font-weight: 800; text-align: center; }
    .board .lb-empty { display: block; color: var(--muted); font-style: italic; }
    .lb-rooms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 560px) { .lb-rooms { grid-template-columns: 1fr; } }
    .lb-who { color: var(--muted); }
    .lb-who b { color: var(--text); }
    .lb-who input {
      width: 12em; padding: 3px 6px; border: 1px solid #44445e; border-radius: 6px;
      background: #1b1b30; color: var(--text); font: inherit;
    }
    button.link { margin: 0 0 0 4px; padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
    code { font: 12px ui-monospace, Menlo, monospace; background: #1b1b30; padding: 1px 5px; border-radius: 4px; }

    /* ---------- past levels ---------- */
    #overlay:has(.arc-list) { justify-content: flex-start; padding-top: 22px; }
    .arc-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0 8px; }
    .seg { display: inline-flex; border: 1px solid #44445e; border-radius: 999px; overflow: hidden; }
    .seg button {
      margin: 0; padding: 5px 12px; border: 0; border-radius: 0; background: transparent;
      color: var(--muted); font: 600 13px system-ui, -apple-system, sans-serif;
    }
    .seg button + button { border-left: 1px solid #44445e; }
    .seg button.on { background: var(--dc, var(--accent)); color: #1b1b2f; }
    .arc-list { width: min(860px, 100%); text-align: left; }
    .day { margin: 0 0 14px; }
    .day header { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 6px; }
    .day header b { font-size: 15px; }
    .day header span { color: var(--muted); font-size: 12px; }
    .day-rooms, .flat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 720px) { .day-rooms, .flat { grid-template-columns: 1fr; } }
    button.tile {
      display: flex; flex-direction: column; margin: 0; padding: 0; overflow: hidden;
      border: 1px solid #34344e; border-radius: 12px; background: #17172a; color: var(--text);
      text-align: left; font: 13px system-ui, -apple-system, sans-serif; cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    button.tile:hover { transform: translateY(-2px); border-color: var(--dc); filter: none; }
    button.tile.hl { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.35); }
    /* a tiny postcard of the room's theme: its sky, and a ledge in its colours */
    .tile-art {
      position: relative; height: 54px;
      background: linear-gradient(180deg, var(--s1), var(--s2) 60%, var(--s3));
    }
    .tile-art::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 12px;
      background: var(--f); border-top: 4px solid var(--e);
    }
    .tile-twist { position: absolute; left: 8px; top: 8px; padding: 1px 8px; border-radius: 999px; background: rgba(10, 10, 25, 0.6); color: #fff; font-size: 11px; font-weight: 700; }
    .tile-icon { position: absolute; right: 10px; top: 8px; font-size: 22px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
    .tile-body { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px 10px; }
    .tile-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
    .tile-top b { font-size: 15px; }
    .tile-theme, .tile-date, .tile-meta { color: var(--muted); font-size: 12px; }
    .meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; margin-top: 2px; }
    .meter i { height: 6px; border-radius: 2px; background: #2c2c44; }
    .meter i.f { background: var(--dc); }
    .tile-diff { color: var(--dc); font-weight: 700; font-size: 12px; }
    .tile-best { font-variant-numeric: tabular-nums; }
    .tile-best b { margin-left: 4px; }
    .muted { color: var(--muted); }

    /* the date line and title double as the secret dev-menu sequence; keep
       repeated clicks from highlighting them and giving it away */
    #overlay h1, #overlay .sub { user-select: none; -webkit-user-select: none; }

    .dev-fab {
      position: fixed;
      bottom: 8px;
      left: 8px;
      z-index: 11;
      margin: 0;
      padding: 5px 10px;
      border: 1px solid #44445e;
      border-radius: 8px;
      background: rgba(10, 10, 22, 0.92);
      color: var(--accent);
      font: 700 12px ui-monospace, Menlo, monospace;
    }
    .dev-fab.on { background: var(--accent); color: #1b1b2f; }
    .dev {
      position: fixed;
      bottom: 42px;
      left: 8px;
      z-index: 10;
      width: min(320px, calc(100vw - 16px));
      max-height: calc(100dvh - 48px);
      overflow-y: auto;
      padding: 10px 12px;
      border: 1px solid #44445e;
      border-radius: 10px;
      background: rgba(10, 10, 22, 0.94);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      font: 12px ui-monospace, Menlo, monospace;
      color: var(--muted);
    }
    .dev[hidden] { display: none; }
    .dev-head { color: var(--accent); font-weight: 700; }
    .dev-info { margin-top: 2px; line-height: 1.4; }
    .dev-live { color: var(--text); white-space: pre; margin: 6px 0 2px; font-size: 11px; overflow-x: auto; }
    .dev-group {
      margin: 8px 0 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .dev-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .dev button {
      margin: 0;
      padding: 5px 8px;
      border: 1px solid #44445e;
      border-radius: 6px;
      background: #22223a;
      color: var(--text);
      font: 12px ui-monospace, Menlo, monospace;
      text-align: left;
    }
    .dev button:hover { filter: brightness(1.25); }
    .dev button.on { background: var(--accent); color: #1b1b2f; }
    .dev-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #2c2c44;
      font-size: 11px;
    }
    /* ---------- touch controls (phones/tablets only; shown by game.js) ---------- */
    body.touch { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    body.touch input { -webkit-user-select: text; user-select: text; }
    .tpads[hidden] { display: none; }
    .tpads {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 12px;
      padding: 0 max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      pointer-events: none;
      z-index: 5;
    }
    .tpad, .tsmall, body.touch canvas { pointer-events: auto; touch-action: none; }
    .tpad {
      display: flex;
      height: 96px;
      border-radius: 22px;
      background: rgba(15, 15, 30, 0.38);
      border: 2px solid rgba(255, 255, 255, 0.28);
      color: rgba(255, 255, 255, 0.8);
      font: 800 26px system-ui, -apple-system, sans-serif;
      backdrop-filter: blur(2px);
    }
    .tpad span { flex: 1; display: grid; place-items: center; border-radius: 20px; }
    .tpad span.on, #tJump.on span { background: rgba(255, 209, 102, 0.55); color: #10223a; }
    #tMove { width: 220px; }
    #tMove span + span { border-left: 1px solid rgba(255, 255, 255, 0.2); }
    #tJump { width: 140px; font-size: 20px; letter-spacing: 0.08em; }
    .tside { display: flex; gap: 10px; margin-bottom: 26px; }
    .tsmall {
      width: 46px; height: 46px; padding: 0; margin: 0;
      border-radius: 50%;
      background: rgba(15, 15, 30, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff; font-size: 20px;
    }
    .tsmall[hidden] { display: none; }
    body.touch .ghost-btn { padding: 8px 14px; }
    body.touch .ghost-btn kbd, body.touch .keys { display: none; }
    /* Landscape phone: the room shrinks a little so both pads live in the side
       gutters — in a precision game, controls must never cover a spike. */
    @media (orientation: landscape) {
      body.touch .game { width: min(960px, calc(100vw - 2 * var(--gut)), calc((100dvh - 32px) * 16 / 9)); margin-bottom: 0; }
      body.touch .ghost-btn { position: fixed; top: 14px; left: max(14px, env(safe-area-inset-left)); right: auto; max-width: calc(var(--gut) - 22px); white-space: normal; }
      body.touch .toast { position: fixed; top: 6px; bottom: auto; }
      body.touch .tip { position: fixed; top: 96px; left: max(10px, env(safe-area-inset-left)); right: auto; width: calc(var(--gut) - 14px); max-width: none; font-size: 12px; padding: 6px 8px;
        white-space: normal; max-height: calc(100dvh - 96px - 150px); } /* stops above the move pad */
      body.touch { --gut: max(148px, calc(132px + env(safe-area-inset-left))); }
      body.touch #tMove { width: calc(var(--gut) - 22px); height: 120px; }
      body.touch #tJump { width: calc(var(--gut) - 22px); height: 120px; }
      body.touch .tside { position: fixed; top: 14px; right: max(14px, env(safe-area-inset-right)); margin: 0; flex-direction: column; } /* a column fits the gutter even with ✕ */
    }
    /* Portrait (a phone held upright): the 16:9 room is barely 200px tall — far too
       small for the title, rank cards and results, which take the whole screen instead.
       (Only while one is showing: in a room, the room stays at the top.) */
    @media (orientation: portrait) and (max-width: 820px) {
      #overlay { position: fixed; inset: 0; z-index: 30; border-radius: 0;
        padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
    }
    /* Portrait phone: the 16:9 room sits at the top, controls get the space below it. */
    @media (orientation: portrait) {
      body.touch { align-items: flex-start; padding-top: max(16px, env(safe-area-inset-top)); }
      body.touch .tpads { padding-bottom: max(28px, env(safe-area-inset-bottom)); }
      body.touch .tpad { height: 120px; }
      body.touch #tMove { flex: 1.5; width: auto; }
      body.touch #tJump { flex: 1; width: auto; }
      body.touch .tside { flex-direction: column; margin-bottom: 0; }
    }
    .dev button.dev-exit { flex-shrink: 0; color: #ff8fa3; border-color: #5e2c3a; background: transparent; }
  </style>
</head>
<body>
  <div class="game">
    <div class="stage">
      <canvas id="game"></canvas>
      <div id="overlay" hidden></div>
    </div>
    <button id="ghostBtn" class="ghost-btn" type="button" hidden>👻 Show ghost <kbd>G</kbd></button>
    <div id="tip" class="tip" role="status" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
  <div id="touch" class="tpads" hidden>
    <div class="tpad" id="tMove"><span data-dir="-1">◀</span><span data-dir="1">▶</span></div>
    <div class="tside">
      <button id="tBack" type="button" class="tsmall" hidden>✕</button>
      <button id="tRestart" type="button" class="tsmall">↻</button>
      <button id="tFlag" type="button" class="tsmall" hidden aria-label="Plant a practice flag">🚩</button>
      <button id="tMute" type="button" class="tsmall">🔊</button>
    </div>
    <div class="tpad" id="tJump"><span>JUMP</span></div>
  </div>
  <script>
    // Which server to play with: the live one, if it answers and allows this site.
    (async () => {
      try {
        const { url } = await (await fetch('../url.json?' + Date.now(), { cache: 'no-store' })).json();
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 5000);
        const cfg = await (await fetch(url + '/api/config', { signal: ctl.signal })).json();
        clearTimeout(timer);
        window.DJ_API = cfg && cfg.cors ? url : null;
      } catch {
        window.DJ_API = null; // away (or not yet allowing this site): offline mode
      }
      const g = document.createElement('script');
      g.src = 'game.js';
      document.body.appendChild(g);
    })();
  </script>
  <script>
    // installable + playable offline (only when served over http(s), not from disk)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
