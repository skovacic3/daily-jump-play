<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Jump</title>
  <meta name="description" content="A daily one-screen precision platformer: three new rooms every day, the same for everyone.">
  <meta property="og:title" content="Daily Jump">
  <meta property="og:description" content="Three new rooms every day, the same for everyone. Wall-jump, dodge spikes and saws, race other players' ghosts.">
  <meta property="og:image" content="https://skovacic3.github.io/daily-jump-play/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #0f0f1e; color: #f1faee; font: 16px system-ui, -apple-system, sans-serif; }
    body { display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { color: #ffd166; margin: 0 0 8px; font-size: 42px; }
    p { color: #a8a8c0; }
    a { color: #ffd166; }
    img { width: 96px; height: 96px; border-radius: 20px; }
  </style>
</head>
<body>
  <main>
    <img src="icon-192.png" alt="">
    <h1>Daily Jump</h1>
    <p id="msg">Finding today's rooms…</p>
  </main>
  <script>
    // This page is the permanent link: the game itself is served from a tunnel whose
    // address can change, so look up the current one and go there.
    (async () => {
      const msg = document.getElementById('msg');
      try {
        const { url } = await (await fetch('url.json?' + Date.now(), { cache: 'no-store' })).json();
        const ok = await fetch(url + '/api/health', { mode: 'cors' }).then((r) => r.ok).catch(() => null);
        if (ok === false) throw new Error('down');
        location.replace(url + '/' + location.search);
      } catch {
        msg.innerHTML = 'The game is restarting — try again in a minute. <a href="">Retry</a>';
      }
    })();
  </script>
</body>
</html>
